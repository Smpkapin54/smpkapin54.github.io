<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<title>BenDavis.IO</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<style type="text/css">
  html, body { margin: 0; padding: 0; }
  a { text-decoration: underline; }
  .navlink { cursor: pointer; }
  h1 { font-size: 140%; margin: 6px 0; }
  h2 { font-size: 115%; margin: 14px 0 4px 0; }
  p { margin: 6px 0; line-height: 1.45; }
  .sub { font-size: 85%; }
</style>
<script type="text/javascript">
var API = "https://api.github.com/repos/bendedavis/bendedavis.github.io/issues/1";
var state = {"bg":"#000000","fg":"#dddddd","link":"#6699ff","visited":"#9966cc","accent":"#ffffff","font":"arial","layout":"top","navWidth":180,"headline":"bitmap","size":15,"version":4};
var etag = null, currentPage = "main", appliedVersion = 0;

var FONTS = {
  "times": "Times New Roman, Times, serif",
  "mono": "Courier New, Courier, monospace",
  "sans": "Verdana, Geneva, sans-serif",
  "georgia": "Georgia, serif",
  "arial": "Arial, Helvetica, sans-serif"
};

var PAGES = {
"main": "<h1>Welcome to BenDavis.IO</h1>"
+ "<p>BenDavis.IO designs and builds software instruments and effects for modular synthesis, and hardware for guitar. Our current product line includes thirteen modules for Cherry Audio Voltage Modular, with additional products in development.</p>"
+ "<h2>Products</h2>"
+ "<p><b>Voltage Modular modules</b> - Series One instruments, utilities and effects, available individually and in bundles through the Cherry Audio store. Every module includes a five-day demonstration period.</p>"
+ "<p><b>Tern</b> - A sample-based software instrument for Windows and Linux, currently in beta testing ahead of its production release.</p>"
+ "<p><b>First Contact</b> - A high-impedance guitar front-end and limiter pedal, currently in development.</p>"
+ "<h2>Latest News</h2>"
+ "<p><b>November 5, 2026</b> - Tern 0.3.0 beta released to testers for Windows and Linux. Thirteen Series One modules are now available in the Cherry Audio store.</p>"
+ "<p>Product information is available on the Modules and Music pages. Company background is on the About page.</p>",
"modules": "<h1>Modules</h1>"
+ "<p class='sub'>For Cherry Audio Voltage Modular. Available through the <a href='https://store.cherryaudio.com/manufacturers/ben-davis'>Cherry Audio store</a>. Every module includes a five-day demonstration.</p><hr>"
+ "<h2>Series One - $5 each</h2>"
+ "<p>KICK &middot; BOOL &middot; RECT &middot; QDIV &middot; BELL &middot; BONG &middot; FOLD &middot; ORBIT &middot; PLATE &middot; TIC &middot; PRE &middot; PARA &middot; VIBE</p>"
+ "<h2>Bundles</h2>"
+ "<p>Complete Bundle - $39<br>Logic &amp; Utility - $14<br>Drums - $10.50<br>FX - $21</p>"
+ "<h2>Engineering</h2>"
+ "<p>Every BenDavis.IO module is designed, built and play-tested in-house before submission. Designs are original; no module is a re-skin of a textbook circuit or algorithm. Support questions are answered by the designer.</p>",
"music": "<h1>Music</h1>"
+ "<p class='sub'>Recordings by Ben Davis, founder of BenDavis.IO.</p><hr>"
+ "<h2>Cycles</h2><p>2019 &middot; Detroit Underground. Five tracks composed with TidalCycles: generative patterns and detailed drum programming.</p>"
+ "<h2>Mures EP</h2><p>2024 &middot; Clavitronics. Techno.</p>"
+ "<h2>Verified</h2><p>2025 &middot; Self-released.</p>"
+ "<h2>Verified (DJ Manny Remix)</h2><p>2026 &middot; Self-released.</p>",
"about": "<h1>About BenDavis.IO</h1><hr>"
+ "<p>BenDavis.IO is the design practice of Ben Davis, based in Fort Wayne, Indiana. The company builds original instruments: software modules for Voltage Modular, the Tern software instrument, and guitar hardware.</p>"
+ "<p>Ben's design work reaches back to Eurorack hardware. The sequencer concepts behind the Varigate series and the Voltage Block were developed during his time at Malekko Heavy Industry. He designed the original &#181;Braids oscillator adaptation, and at 4ms Company he originated the META module concept and wrote its VCV Rack code.</p>"
+ "<p>BenDavis.IO exists to build that catalogue under its own name: original designs, engineered and supported by their designer.</p>"
+ "<h2>Contact</h2>"
+ "<p>For product support, please write by email and include the product name in the subject line. Support is handled by the designer.</p>"
};

function mastheadHTML() {
  var word = state.headline === "bitmap"
    ? "<img src='../headline.png' width='360' height='56' alt='BENDAVIS.IO'>"
    : "<span style='font-size:170%;font-weight:bold;'>BENDAVIS.IO</span>";
  var links = [["main","Home"],["modules","Modules"],["music","Music"],["about","About"]];
  var nav = "";
  for (var i = 0; i < links.length; i++) {
    if (i > 0) { nav += " | "; }
    nav += "<a class='navlink' onclick=\"go('" + links[i][0] + "')\">" + links[i][1] + "</a>";
  }
  nav += " | <a href='https://store.cherryaudio.com/manufacturers/ben-davis'>Store</a>";
  return "<table border='0' cellpadding='0' cellspacing='0' width='100%'><tr><td style='padding:14px 16px 8px 16px;'>"
    + word
    + "<br><span style='font-size:85%;'>Instruments &amp; Effects &middot; Fort Wayne, Indiana</span>"
    + "</td></tr>"
    + "<tr><td style='padding:6px 16px;border-top:1px solid #ffffff;border-bottom:1px solid #ffffff;'>" + nav + "</td></tr></table>";
}

function sideNavHTML() {
  var word = state.headline === "bitmap"
    ? "<img src='../headline.png' width='270' height='42' alt='BENDAVIS.IO'>"
    : "<span style='font-size:150%;font-weight:bold;'>BENDAVIS.IO</span>";
  var links = [["main","Home"],["modules","Modules"],["music","Music"],["about","About"]];
  var h = word + "<br><span style='font-size:80%;'>Fort Wayne, Indiana</span><hr>";
  for (var i = 0; i < links.length; i++) {
    h += "<a class='navlink' onclick=\"go('" + links[i][0] + "')\">" + links[i][1] + "</a><br><br>";
  }
  h += "<hr><span style='font-size:80%;'>Products are available through the <a href='https://store.cherryaudio.com/manufacturers/ben-davis'>Cherry Audio store</a>.</span>";
  return h;
}

function footerHTML() {
  return "<div style='padding:10px 16px;border-top:1px solid #ffffff;font-size:80%;'>&copy; 2026 BenDavis.IO &middot; Fort Wayne, Indiana &middot; All rights reserved.</div>";
}

function render() {
  var s = state;
  document.body.style.backgroundColor = s.bg;
  document.body.style.color = s.fg;
  document.body.style.fontFamily = FONTS[s.font] || FONTS["arial"];
  document.body.style.fontSize = (s.size || 15) + "px";
  var root = document.getElementById("root");
  var content = "<div style='padding:14px 16px;max-width:760px;'>" + PAGES[currentPage] + "</div>";
  if (s.layout === "top") {
    root.innerHTML = mastheadHTML() + content + footerHTML();
  } else if (s.layout === "single") {
    root.innerHTML = content;
  } else {
    root.innerHTML = "<table border='0' cellpadding='0' cellspacing='0' width='100%'><tr>"
      + "<td valign='top' width='" + (s.navWidth || 180) + "'><div style='padding:12px;'>" + sideNavHTML() + "</div></td>"
      + "<td valign='top'>" + content + "</td></tr></table>" + footerHTML();
  }
  var as = root.getElementsByTagName("a");
  for (var i = 0; i < as.length; i++) { as[i].style.color = s.link; }
  var st = document.getElementById("stylestate");
  if (st) { st.innerHTML = "style v" + s.version + " - live bench"; }
}

function go(p) { currentPage = p; render(); }

function poll() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", API, true);
  if (etag) { xhr.setRequestHeader("If-None-Match", etag); }
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        etag = xhr.getResponseHeader("ETag");
        try {
          var issue = JSON.parse(xhr.responseText);
          var m = /```json\s*([\s\S]*?)```/.exec(issue.body || "");
          if (m) {
            var next = JSON.parse(m[1]);
            if (next.version !== appliedVersion) {
              state = next; appliedVersion = next.version; render();
            }
          }
        } catch (e) { }
      }
      setTimeout(poll, 3000);
    }
  };
  xhr.send(null);
}
</script>
</head>
<body>
<div id="root"></div>
<div id="stylestate" style="position:fixed;right:6px;bottom:4px;font-size:11px;opacity:0.55;"></div>
<script type="text/javascript">render(); poll();</script>
</body>
</html>
